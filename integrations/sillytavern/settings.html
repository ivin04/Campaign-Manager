<div class="campaign-manager-settings">
    <h4>Campaign Manager</h4>

    <label class="checkbox_label">
        <input
            id="campaign-manager-enabled"
            type="checkbox"
        >
        <span>Enabled</span>
    </label>

    <div class="campaign-manager-setting">
        <label for="campaign-manager-url">
            Backend URL
        </label>

        <input
            id="campaign-manager-url"
            type="text"
            class="text_pole"
            placeholder="http://127.0.0.1:8765"
        >
    </div>

    <div class="campaign-manager-setting">
        <label for="campaign-manager-query">
            Context query
        </label>

        <input
            id="campaign-manager-query"
            type="text"
            class="text_pole"
            placeholder="Current campaign state"
        >
    </div>

    <div class="campaign-manager-actions">
        <button
            id="campaign-manager-test"
            class="menu_button"
            type="button"
        >
            Test connection
        </button>
    </div>

    <div
        id="campaign-manager-status"
        class="campaign-manager-status"
    >
        Not connected
    </div>
</div>
