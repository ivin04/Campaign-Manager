[project]
name = "campaign-manager"
version = "0.1.0"
description = "Campaign world state and operation engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_llm: tests that require a running Ollama instance",
]